<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlsNoSound — Releases</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            line-height: 1.5;
            margin: 0;
            padding: 2rem 1.5rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #aaa;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #fff;
        }
        .releases-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }
        .release-card {
            background: #141414;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .release-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .release-card:hover::after {
            opacity: 1;
        }
        .release-card:hover {
            border-color: #ffffff;
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1);
        }
        .release-cover {
            background: #0a0a0a;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #2a2a2a;
            overflow: hidden;
        }
        .release-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .release-card:hover .release-cover img {
            transform: scale(1.1);
        }
        .release-info {
            padding: 1rem;
        }
        .release-artist {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        .release-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
        .release-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            position: relative;
        }
        .release-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #fff;
            transition: width 0.3s ease;
        }
        .release-link:hover::after {
            width: 100%;
        }
        .release-link:hover {
            color: #fff;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #555;
        }
        
        /* Адаптивность */
        @media (max-width: 1200px) {
            .releases-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 900px) {
            .releases-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .releases-grid {
                grid-template-columns: 1fr;
            }
            .release-cover {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to home</a>
        <h1>🔊 PlsNoSound releases</h1>
        <div class="releases-grid">
            <!-- RELEASES_PLACEHOLDER -->
            <!-- END_RELEASES_PLACEHOLDER -->
        </div>
        <div class="footer">
            <p>© PlsNoSound — sub-label of Crunchy Cakes · est. 2025</p>
        </div>
    </div>
</body>
</html>
