name: Update Releases from Google Sheets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch releases from Google Sheets (CSV)
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/export?format=csv&gid=0" -o releases.csv

      - name: Generate releases HTML
        run: |
          python3 .github/scripts/generate_releases.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html releases.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update releases from Google Sheets"
          git push
