<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All releases — Crunchy Cakes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            line-height: 1.5;
            margin: 0;
            padding: 2rem 1.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #aaa;
            text-decoration: none;
        }
        .back-link:hover {
            color: #fff;
        }
        .releases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .release-card {
            background: #141414;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .release-card:hover {
            border-color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }
        .release-cover {
            background: #0a0a0a;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .release-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .release-info {
            padding: 1rem;
        }
        .release-artist {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        .release-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
        .release-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .release-link:hover {
            color: #fff;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to home</a>
        <h1>📀 All releases</h1>
        <!-- RELEASES_PLACEHOLDER -->

        <div class="release-card">
            <div class="release-cover">
                <img src="https://cdn-image.zvuk.com/pic?hash=bfc71d24-c9d9-49fb-90f0-5a01ea8b32de&id=49885738&size=large&type=release" alt="SILEVA">
            </div>
            <div class="release-info">
                <div class="release-artist">RLXM &amp; Dragena</div>
                <div class="release-title">SILEVA</div>
                <a href="https://open.spotify.com/album/2obH1dKCvQcWbPafRLKoG6?si=RnH7vEchSIm20DljZFCUkQ" class="release-link" target="_blank">Listen on Spotify →</a>
            </div>
        </div>

        <div class="release-card">
            <div class="release-cover">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNql6a6CZxJzlvvdfLudXRnJv8DQDQuY1q-g&s" alt="MONTAGEM DESONA (ALT VERSION)">
            </div>
            <div class="release-info">
                <div class="release-artist">Dragena</div>
                <div class="release-title">MONTAGEM DESONA (ALT VERSION)</div>
                <a href="https://open.spotify.com/album/75vZ8q7VA2NebrkdaZiCsQ?si=U_0hRHsLS1uHjtcUTda43A" class="release-link" target="_blank">Listen on Spotify →</a>
            </div>
        </div>

        <div class="release-card">
            <div class="release-cover">
                <span class="placeholder">🎵</span>
            </div>
            <div class="release-info">
                <div class="release-artist">Jaraz</div>
                <div class="release-title">MONTAGEM PARADOJE</div>
                <a href="https://open.spotify.com/album/72uuZsYXb6nSWOHutp9mS0?si=5TbSNwyaRAWHSRDgTtv1lw" class="release-link" target="_blank">Listen on Spotify →</a>
            </div>
        </div>

        <div class="release-card">
            <div class="release-cover">
                <span class="placeholder">🎵</span>
            </div>
            <div class="release-info">
                <div class="release-artist">NXPXLM</div>
                <div class="release-title">MONTAGEM ROLADA</div>
                <a href="https://open.spotify.com/album/18uRiJ5AinMiftM2KV00K5?si=WwNr0k0PRYO_MfWFpptFLQ" class="release-link" target="_blank">Listen on Spotify →</a>
            </div>
        </div>
<!-- END_RELEASES_PLACEHOLDER -->
        <div class="footer">
            <p>© 2025 Crunchy Cakes — independent music label</p>
        </div>
    </div>
</body>
</html>
