<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All releases — Crunchy Cakes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            line-height: 1.5;
            margin: 0;
            padding: 2rem 1.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #aaa;
            text-decoration: none;
        }
        .back-link:hover {
            color: #fff;
        }
        .releases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .release-card {
            background: #141414;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .release-card:hover {
            border-color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }
        .release-cover {
            background: #0a0a0a;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .release-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .release-info {
            padding: 1rem;
        }
        .release-artist {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        .release-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
        .release-link {
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .release-link:hover {
            color: #fff;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to home</a>
        <h1>📀 All releases</h1>
        <!-- RELEASES_PLACEHOLDER -->
        <div class="releases-grid">
            <!-- all releases will be inserted here -->
        </div>
        <!-- END_RELEASES_PLACEHOLDER -->
        <div class="footer">
            <p>© 2025 Crunchy Cakes — independent music label</p>
        </div>
    </div>
</body>
</html>
